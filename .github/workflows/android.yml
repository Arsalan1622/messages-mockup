name: Build Messages mockup APK

# Push to main builds + tests; pushing a tag like v1.0, or clicking
# "Run workflow" in the Actions tab, also publishes a GitHub release
# (v1.0 for manual runs) with the APK attached.
#
# Release signing needs these repo secrets (see keystore-backup/ locally):
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the release APK is built UNSIGNED (installable only after
# signing with apksigner) — CI still runs tests + build.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create the GitHub release on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Decode binary assets (icons, gradle wrapper jar)
        run: sh tools/decode-assets.sh

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # NOTE: the condition must read the secret directly. A previous version
      # used `if: env.ANDROID_KEYSTORE_BASE64 != ''`, but a step's own env is
      # NOT visible to its `if` condition, so the step was silently skipped
      # and v1.0 shipped UNSIGNED. Never use env.* in this step's `if`.
      - name: Decode release keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > messages-mockup-release.keystore
          printf 'storeFile=messages-mockup-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > keystore.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Unit tests (merge/sort/date logic) run BEFORE the APK build.
      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      # Fail loudly if the APK is unsigned — never ship an unsigned release
      # again (v1.0 shipped unsigned because the keystore step was skipped).
      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | head -n 1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found under $SDK"; exit 1; fi
          "$APKSIGNER" verify build/app/outputs/flutter-apk/app-release.apk && echo "APK signature verified"

      - name: Name the APK
        run: |
          cd build/app/outputs/flutter-apk
          if [ -f app-release.apk ]; then
            cp app-release.apk messages-mockup-v1.0-release.apk
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            cp app-release-unsigned.apk messages-mockup-v1.0-unsigned.apk
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: messages-mockup-apk
          path: build/app/outputs/flutter-apk/messages-mockup-*.apk
          if-no-files-found: error

      # Runs on tag pushes (v1.0, v1.1, ...) and on manual "Run workflow"
      # clicks (which publish as v1.0) — so no git tag step is ever needed
      # from the agent side: push to main, then Run workflow, and the
      # release appears with the APK attached.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0' }}
          files: build/app/outputs/flutter-apk/messages-mockup-*.apk
          body: |
            Messages (mockup) — testing clone of Google Messages.
            Shows the real SMS inbox (read-only) and simulates incoming
            messages locally. This app NEVER sends SMS.
            See README.md for the phone test steps.
